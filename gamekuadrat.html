<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Tarik Tambang - Persamaan Kuadrat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #87CEEB 0%, #E0F6FF 100%);
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    text-align: center;
    color: #2c3e50;
    margin-bottom: 10px;
    text-shadow: 2px 2px 4px rgba(255,255,255,0.5);
  }
  .subtitle {
    text-align: center;
    color: #555;
    margin-bottom: 20px;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: white;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    padding: 20px;
  }
  .scoreboard {
    display: flex;
    justify-content: space-around;
    background: #f8f9fa;
    padding: 15px;
    border-radius: 15px;
    margin-bottom: 15px;
  }
  .team-score {
    text-align: center;
    padding: 10px 20px;
    border-radius: 10px;
    font-weight: bold;
    min-width: 150px;
  }
  .team-left { background: #3498db; color: white; }
  .team-right { background: #e74c3c; color: white; }
  .turn-indicator {
    text-align: center;
    font-size: 1.2em;
    font-weight: bold;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 15px;
    background: #f1c40f;
    color: #2c3e50;
  }
  .game-area {
    position: relative;
    height: 220px;
    background: linear-gradient(180deg, #87CEEB 0%, #90EE90 70%, #228B22 100%);
    border-radius: 15px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .ground {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 50px;
    background: linear-gradient(180deg, #8B4513, #654321);
  }
  .center-line {
    position: absolute;
    top: 0;
    left: 50%;
    width: 3px;
    height: 100%;
    background: rgba(255,255,255,0.5);
    transform: translateX(-50%);
  }
  .flag {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2em;
    z-index: 2;
  }
  .character {
    position: absolute;
    bottom: 50px;
    font-size: 3em;
    transition: left 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    z-index: 3;
  }
  .char-left { left: 30%; }
  .char-right { right: 30%; }
  .rope {
    position: absolute;
    top: 50%;
    height: 8px;
    background: linear-gradient(90deg, #8B4513, #D2691E, #8B4513);
    border-radius: 4px;
    transform: translateY(-50%);
    transition: all 0.8s ease;
    z-index: 1;
  }
  .ribbon {
    position: absolute;
    top: 50%;
    width: 20px;
    height: 30px;
    background: #f1c40f;
    transform: translate(-50%, -50%);
    transition: left 0.8s ease;
    z-index: 2;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
  }
  .question-panel {
    background: #ecf0f1;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 15px;
  }
  .question-number {
    font-size: 0.9em;
    color: #7f8c8d;
    margin-bottom: 5px;
  }
  .question-text {
    font-size: 1.1em;
    color: #2c3e50;
    margin-bottom: 15px;
    line-height: 1.5;
  }
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .option-btn {
    padding: 12px;
    border: 2px solid #3498db;
    background: white;
    color: #2c3e50;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1em;
    transition: all 0.2s;
    text-align: left;
  }
  .option-btn:hover:not(:disabled) {
    background: #3498db;
    color: white;
    transform: translateY(-2px);
  }
  .option-btn:disabled { cursor: not-allowed; opacity: 0.7; }
  .option-btn.correct { background: #27ae60; color: white; border-color: #27ae60; }
  .option-btn.wrong { background: #e74c3c; color: white; border-color: #e74c3c; }
  .feedback {
    text-align: center;
    padding: 10px;
    border-radius: 10px;
    margin-top: 10px;
    font-weight: bold;
    min-height: 40px;
  }
  .feedback.correct { background: #d4edda; color: #155724; }
  .feedback.wrong { background: #f8d7da; color: #721c24; }
  .next-btn {
    display: block;
    margin: 15px auto 0;
    padding: 12px 30px;
    background: #f39c12;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1.1em;
    cursor: pointer;
    font-weight: bold;
  }
  .next-btn:hover { background: #e67e22; }
  .next-btn:disabled { background: #bdc3c7; cursor: not-allowed; }
  .final-screen {
    text-align: center;
    padding: 30px;
  }
  .final-screen h2 { font-size: 2em; margin-bottom: 20px; }
  .winner { color: #27ae60; }
  .loser { color: #e74c3c; }
  .restart-btn {
    padding: 15px 40px;
    background: #3498db;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1.2em;
    cursor: pointer;
    margin-top: 20px;
  }
  .restart-btn:hover { background: #2980b9; }
  .math { font-family: 'Cambria Math', serif; font-style: italic; }
</style>
</head>
<body>

<div class="container">
  <h1>🪢 Tarik Tambang 🪢</h1>
  <p class="subtitle">Persamaan Kuadrat — Tim Kiri vs Tim Kanan</p>

  <div class="scoreboard">
    <div class="team-score team-left">
      <div>🔵 TIM KIRI</div>
      <div id="score-left">Benar: 0</div>
    </div>
    <div class="team-score team-right">
      <div>🔴 TIM KANAN</div>
      <div id="score-right">Benar: 0</div>
    </div>
  </div>

  <div class="turn-indicator" id="turn-indicator">Giliran: TIM KIRI — Soal 1</div>

  <div class="game-area">
    <div class="center-line"></div>
    <div class="flag">⚑</div>
    <div class="rope" id="rope"></div>
    <div class="ribbon" id="ribbon"></div>
    <div class="character char-left" id="char-left">🧍</div>
    <div class="character char-right" id="char-right">🧍‍♂️</div>
    <div class="ground"></div>
  </div>

  <div id="game-content">
    <div class="question-panel">
      <div class="question-number" id="q-number">Soal 1 dari 5</div>
      <div class="question-text" id="q-text"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
    </div>
    <button class="next-btn" id="next-btn" disabled>Lanjut ➡</button>
  </div>

  <div id="final-screen" class="final-screen" style="display:none;">
    <h2 id="final-title"></h2>
    <p id="final-detail"></p>
    <button class="restart-btn" onclick="location.reload()">🔄 Main Lagi</button>
  </div>
</div>

<script>
// 5 pasang soal dengan TOPIK SAMA untuk tiap tim
const questions = [
  {
    topic: "Akar-akar Persamaan Kuadrat",
    left: {
      q: "Tentukan akar-akar dari persamaan <span class='math'>x² − 5x + 6 = 0</span>!",
      options: ["x = 1 dan x = 6", "x = 2 dan x = 3", "x = −2 dan x = −3", "x = −1 dan x = 6"],
      answer: 1
    },
    right: {
      q: "Tentukan akar-akar dari persamaan <span class='math'>x² − 7x + 12 = 0</span>!",
      options: ["x = 3 dan x = 4", "x = 2 dan x = 6", "x = −3 dan x = −4", "x = 1 dan x = 12"],
      answer: 0
    }
  },
  {
    topic: "Diskriminan Persamaan Kuadrat",
    left: {
      q: "Berapakah diskriminan dari persamaan <span class='math'>2x² − 4x + 1 = 0</span>?",
      options: ["D = 8", "D = 12", "D = 24", "D = −8"],
      answer: 0
    },
    right: {
      q: "Berapakah diskriminan dari persamaan <span class='math'>x² + 6x + 5 = 0</span>?",
      options: ["D = 11", "D = 16", "D = 36", "D = −16"],
      answer: 1
    }
  },
  {
    topic: "Jumlah dan Hasil Kali Akar",
    left: {
      q: "Jika <span class='math'>x₁</span> dan <span class='math'>x₂</span> akar-akar dari <span class='math'>x² − 3x − 10 = 0</span>, berapakah <span class='math'>x₁ · x₂</span>?",
      options: ["3", "−3", "10", "−10"],
      answer: 3
    },
    right: {
      q: "Jika <span class='math'>x₁</span> dan <span class='math'>x₂</span> akar-akar dari <span class='math'>x² − 8x + 15 = 0</span>, berapakah <span class='math'>x₁ + x₂</span>?",
      options: ["15", "−8", "8", "−15"],
      answer: 2
    }
  },
  {
    topic: "Menyusun Persamaan Kuadrat Baru",
    left: {
      q: "Persamaan kuadrat yang akar-akarnya <span class='math'>2</span> dan <span class='math'>5</span> adalah ...",
      options: [
        "x² − 7x + 10 = 0",
        "x² + 7x + 10 = 0",
        "x² − 7x − 10 = 0",
        "x² + 3x + 10 = 0"
      ],
      answer: 0
    },
    right: {
      q: "Persamaan kuadrat yang akar-akarnya <span class='math'>3</span> dan <span class='math'>−2</span> adalah ...",
      options: [
        "x² − x − 6 = 0",
        "x² + x − 6 = 0",
        "x² − x + 6 = 0",
        "x² + 5x − 6 = 0"
      ],
      answer: 0
    }
  },
  {
    topic: "Aplikasi Persamaan Kuadrat",
    left: {
      q: "Sebuah persegi panjang memiliki panjang 3 cm lebih dari lebarnya. Jika luasnya 40 cm², berapakah lebarnya?",
      options: ["5 cm", "8 cm", "10 cm", "4 cm"],
      answer: 0
    },
    right: {
      q: "Sebuah persegi panjang memiliki panjang 2 cm lebih dari lebarnya. Jika luasnya 24 cm², berapakah lebarnya?",
      options: ["6 cm", "4 cm", "3 cm", "8 cm"],
      answer: 1
    }
  }
];

let state = {
  currentTeam: 'left', // 'left' atau 'right'
  currentQuestion: 0,  // 0..4
  scoreLeft: 0,
  scoreRight: 0,
  ropePosition: 0,     // -100 (kiri menang) sampai 100 (kanan menang)
  answered: false
};

const rope = document.getElementById('rope');
const ribbon = document.getElementById('ribbon');
const charLeft = document.getElementById('char-left');
const charRight = document.getElementById('char-right');
const turnIndicator = document.getElementById('turn-indicator');
const qNumber = document.getElementById('q-number');
const qText = document.getElementById('q-text');
const optionsDiv = document.getElementById('options');
const feedback = document.getElementById('feedback');
const nextBtn = document.getElementById('next-btn');
const scoreLeftEl = document.getElementById('score-left');
const scoreRightEl = document.getElementById('score-right');

function updateRope() {
  // ropePosition: -100 (kiri) sampai 100 (kanan)
  const percent = 50 + (state.ropePosition / 2); // 0%..100%
  ribbon.style.left = percent + '%';

  // Tali membentang antara dua karakter
  const leftCharLeft = 30 + (state.ropePosition > 0 ? state.ropePosition * 0.15 : 0);
  const rightCharRight = 30 + (state.ropePosition < 0 ? -state.ropePosition * 0.15 : 0);

  const areaWidth = document.querySelector('.game-area').offsetWidth;
  const leftPx = areaWidth * (leftCharLeft / 100) + 20;
  const rightPx = areaWidth * (1 - rightCharRight / 100) - 20;

  rope.style.left = leftPx + 'px';
  rope.style.width = (rightPx - leftPx) + 'px';

  charLeft.style.left = (leftCharLeft - 5) + '%';
  charRight.style.right = (rightCharRight - 5) + '%';
}

function loadQuestion() {
  state.answered = false;
  const q = questions[state.currentQuestion];
  const teamData = state.currentTeam === 'left' ? q.left : q.right;
  const teamName = state.currentTeam === 'left' ? 'TIM KIRI 🔵' : 'TIM KANAN 🔴';

  turnIndicator.textContent = `Giliran: ${teamName} — Soal ${state.currentQuestion + 1}`;
  turnIndicator.style.background = state.currentTeam === 'left' ? '#3498db' : '#e74c3c';
  turnIndicator.style.color = 'white';

  qNumber.textContent = `Topik: ${q.topic} — Soal ${state.currentQuestion + 1} dari 5`;
  qText.innerHTML = teamData.q;
  feedback.textContent = '';
  feedback.className = 'feedback';
  nextBtn.disabled = true;

  optionsDiv.innerHTML = '';
  teamData.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<strong>${String.fromCharCode(65 + idx)}.</strong> ${opt}`;
    btn.onclick = () => selectAnswer(idx, teamData.answer, btn);
    optionsDiv.appendChild(btn);
  });
}

function selectAnswer(selected, correct, btn) {
  if (state.answered) return;
  state.answered = true;

  const buttons = optionsDiv.querySelectorAll('.option-btn');
  buttons.forEach(b => b.disabled = true);

  if (selected === correct) {
    btn.classList.add('correct');
    feedback.textContent = '✅ BENAR! Tali bergerak ke arah tim ini.';
    feedback.className = 'feedback correct';
    if (state.currentTeam === 'left') {
      state.scoreLeft++;
      state.ropePosition = Math.max(-100, state.ropePosition - 20);
    } else {
      state.scoreRight++;
      state.ropePosition = Math.min(100, state.ropePosition + 20);
    }
  } else {
    btn.classList.add('wrong');
    buttons[correct].classList.add('correct');
    feedback.textContent = '❌ SALAH! Tali bergerak ke arah tim lawan.';
    feedback.className = 'feedback wrong';
    if (state.currentTeam === 'left') {
      state.ropePosition = Math.min(100, state.ropePosition + 20);
    } else {
      state.ropePosition = Math.max(-100, state.ropePosition - 20);
    }
  }

  scoreLeftEl.textContent = `Benar: ${state.scoreLeft}`;
  scoreRightEl.textContent = `Benar: ${state.scoreRight}`;
  updateRope();
  nextBtn.disabled = false;
}

nextBtn.onclick = () => {
  // Cek menang lebih dulu
  if (Math.abs(state.ropePosition) >= 100) {
    endGame();
    return;
  }

  // Lanjut ke giliran berikutnya
  if (state.currentTeam === 'left') {
    state.currentTeam = 'right';
  } else {
    state.currentTeam = 'left';
    state.currentQuestion++;
  }

  if (state.currentQuestion >= 5) {
    endGame();
    return;
  }

  loadQuestion();
};

function endGame() {
  document.getElementById('game-content').style.display = 'none';
  const finalScreen = document.getElementById('final-screen');
  finalScreen.style.display = 'block';
  const title = document.getElementById('final-title');
  const detail = document.getElementById('final-detail');

  let winner;
  if (state.ropePosition < 0) winner = 'left';
  else if (state.ropePosition > 0) winner = 'right';
  else winner = state.scoreLeft > state.scoreRight ? 'left' :
                state.scoreRight > state.scoreLeft ? 'right' : 'draw';

  if (winner === 'left') {
    title.innerHTML = '🏆 TIM KIRI MENANG! 🏆';
    title.className = 'winner';
  } else if (winner === 'right') {
    title.innerHTML = '🏆 TIM KANAN MENANG! 🏆';
    title.className = 'loser';
  } else {
    title.innerHTML = '🤝 SERI! 🤝';
    title.style.color = '#f39c12';
  }
  detail.innerHTML = `
    Tim Kiri menjawab benar: <b>${state.scoreLeft}</b> soal<br>
    Tim Kanan menjawab benar: <b>${state.scoreRight}</b> soal<br>
    Posisi akhir tali: <b>${state.ropePosition > 0 ? 'condong ke kanan' : state.ropePosition < 0 ? 'condong ke kiri' : 'tengah'}</b>
  `;
}

// Inisialisasi
window.addEventListener('load', () => {
  updateRope();
  loadQuestion();
});
window.addEventListener('resize', updateRope);
</script>

</body>
</html>
